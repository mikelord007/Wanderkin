<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mousehold — tiny worlds from everyday things</title>
    <meta
      name="description"
      content="Turn a photo of an everyday object into a tiny world you can run, climb, and jump around in."
    />
    <meta name="theme-color" content="#1d3a2e" />
    <link rel="icon" href="/brand/mousehold-mark.svg" type="image/svg+xml" />
    <!-- The display face is the first thing a visitor reads, so it is fetched
         alongside the HTML rather than after the CSS that references it. -->
    <link
      rel="preload"
      href="/brand/fonts/fraunces-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Inline so the boot screen paints before any bundled CSS/JS loads. */
      html, body { margin: 0; padding: 0; background: #1d3a2e; }
      #root { min-height: 100vh; display: flex; }
      .mh-boot {
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #eef2ea;
      }
      /* The mark itself, inlined — a boot screen that has to fetch its own logo
         is a boot screen with a hole in it. */
      .mh-boot__mark { width: 64px; height: 64px; }
      .mh-boot__word {
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .mh-boot p { margin: 0; font-size: 0.875rem; color: #aebdae; }
      .mh-boot__bar {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: #345645;
        overflow: hidden;
      }
      .mh-boot__bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #e8a33d;
        animation: mh-boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes mh-boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mh-boot__bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mh-boot" role="status" aria-live="polite">
        <svg class="mh-boot__mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <defs>
            <clipPath id="mh-boot-arch"><path d="M13 48V27a11 11 0 0 1 22 0v21Z" /></clipPath>
          </defs>
          <rect x="0" y="0" width="48" height="48" rx="12" fill="#16291f" />
          <g clip-path="url(#mh-boot-arch)">
            <rect x="13" y="15" width="22" height="33" fill="#f2efe5" />
            <circle cx="30" cy="25" r="3.4" fill="#e8a33d" />
            <ellipse cx="17" cy="48" rx="14" ry="12" fill="#56997a" />
            <ellipse cx="37" cy="47" rx="12" ry="9" fill="#2e6b4f" />
          </g>
        </svg>
        <div class="mh-boot__word">Mousehold</div>
        <div class="mh-boot__bar" aria-hidden="true"></div>
        <p>Opening the little world…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
